<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto</title>
<link rel="stylesheet" href="styles.css">
<style>
  .contact-form {
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-top: 24px;
  }
  .form-group__label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .form-group__label span {
    font-weight: 400;
    color: var(--muted);
    font-size: 12px;
  }
  .form-group__input,
  .form-group__textarea {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    background: #fff;
    border: 1px solid #d9e6e2;
    border-radius: 6px;
    padding: 12px 14px;
    transition: border-color .2s;
  }
  .form-group__input:focus,
  .form-group__textarea:focus {
    outline: none;
    border-color: var(--teal);
  }
  .form-group__textarea {
    resize: vertical;
    min-height: 120px;
  }
  .contact-card {
    max-width: 560px;
    margin: -100px auto 60px;
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>

<!-- ENCABEZADO -->
<header class="header" id="header">
    <div class="container header__inner">
    <a href="index.html" class="logo">UNIMARKET</a>

    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false">☰</button>

    <nav class="nav" id="nav">
        <ul class="nav__list">
     <li><a href="index.html">Explorar</a></li>
          <li><a href="categorias.html">Categorías</a></li>
          <li><a href="comofunciona.html">Cómo funciona</a></li>
          <li><a href="quienessomos.html">Quiénes somos</a></li>
          <li><a href="contacto.html" class="active">Contacto</a></li>
        </ul>
        <button class="btn btn--outline" id="buyBtn">Publicar producto</button>
        <button class="cart" id="cartBtn" aria-label="Mensajes">
        💬 <span class="cart__count" id="cartCount">0</span>
        </button>
    </nav>
    </div>
</header>

<main>
    <!-- ENCABEZADO DE LA PÁGINA -->
    <section class="hero hero--small">
    <div class="container">
        <h1 class="hero__title">Contacto</h1>
        <p class="hero__text">
          ¿Tienes una duda, un problema con un pedido o simplemente quieres saludar?
          Cuéntanos y te respondemos en 1-2 días hábiles.
        </p>
    </div>
    </section>

    <!-- SECCIÓN DE CONTACTO -->
    <div class="container">
      <div class="card contact-card">
        <div class="card__icon">✉️</div>
        <h2>Contáctanos</h2>
        <p>Escríbenos y te respondemos lo antes posible.</p>

        <form class="contact-form" id="contactForm">
          <div class="form-group">
            <label for="name" class="form-group__label">Nombre <span>(requerido)</span></label>
            <input type="text" id="name" class="form-group__input" placeholder="Tu nombre completo" required>
          </div>

          <div class="form-group">
            <label for="email" class="form-group__label">Correo electrónico <span>(requerido)</span></label>
            <input type="email" id="email" class="form-group__input" placeholder="tucorreo@universitaria.com" required>
          </div>

          <div class="form-group">
            <label for="message" class="form-group__label">Mensaje</label>
            <textarea id="message" class="form-group__textarea" placeholder="Escribe tu mensaje..."></textarea>
          </div>

          <button type="submit" class="btn btn--teal">Enviar mensaje</button>
        </form>
      </div>
    </div>

</main>

<script>
  document.getElementById('contactForm').addEventListener('submit', function (e) {
    e.preventDefault();
    alert('Gracias por tu mensaje. Te responderemos pronto.');
    this.reset();
  });

  document.getElementById('menuToggle').addEventListener('click', function () {
    document.getElementById('nav').classList.toggle('open');
  });

  window.addEventListener('scroll', function () {
    document.getElementById('header').classList.toggle('scrolled', window.scrollY > 40);
  });
</script>

</body>
</html>
