<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos · UniMarket</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="categorias.css">
</head>
<body>

  <!-- ENCABEZADO -->
  <header class="header" id="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">UNIMARKET</a>

      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false">☰</button>

      <nav class="nav" id="nav">
        <ul class="nav__list">
          <li><a href="index.html">Explorar</a></li>
          <li><a href="categorias.html">Categorías</a></li>
          <li><a href="#">Cómo funciona</a></li>
          <li><a href="#">Quiénes somos</a></li>

        <button class="btn btn--outline" id="buyBtn">Publicar producto</button>

  </header>

  <main>

    <section class="hero hero--small">
      <div class="container">

        </p>

      <div class="blog__grid" id="productosGrid"></div>

  <script src="script.js"></script>
