<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Producto · UNIMARKET</title>
<link rel="stylesheet" href="styles.css">

<style>
  .producto {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    margin-top: -100px;
    position: relative;
    z-index: 1;
    background: #fff;
    border: 1px solid #d9e6e2;
    border-radius: var(--radius);
    padding: 40px;
  }
  @media (max-width: 800px) {
    .producto { grid-template-columns: 1fr; }
  }

  .producto__imagen {
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 10px;
    background-size: cover;
    background-position: center;
    background-color: var(--card-bg);
  }

  .producto__categoria {
    font-size: 12px;
    color: var(--teal);
    border: 1px solid var(--teal);
    border-radius: 3px;
    padding: 2px 10px;
    display: inline-block;
    margin-bottom: 14px;
  }

  .producto__titulo { font-size: 32px; margin-bottom: 10px; }

  .producto__precio {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 18px;
  }

  .producto__estado {
    display: inline-block;
    font-size: 13px;
    color: var(--muted);
    background: var(--card-bg);
    border-radius: 4px;
    padding: 4px 10px;
    margin-bottom: 20px;
  }

  .producto__descripcion {
    color: var(--muted);
    margin-bottom: 28px;
    white-space: pre-line;
  }

  .producto__fecha {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    margin-top: 24px;
  }

  .producto--vacio {
    max-width: 560px;
    margin: -100px auto 60px;
    text-align: center;
  }
</style>
</head>
<body>

<!-- ENCABEZADO -->
<header class="header" id="header">
    <div class="container header__inner">
    <a href="index.html" class="logo">UNIMARKET</a>

    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false">☰</button>

    <nav class="nav" id="nav">
        <ul class="nav__list">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="categorias.html">Categorías</a></li>
          <li><a href="comofunciona.html">Cómo funciona</a></li>
          <li><a href="quienessomos.html">Quiénes somos</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
        <a href="publicar.html" class="btn btn--teal">Publicar productos</a>
        <button class="cart" id="cartBtn" aria-label="Mensajes">
        💬 <span class="cart__count" id="cartCount">0</span>
        </button>
    </nav>
    </div>
</header>

<main>
    <!-- ENCABEZADO DE LA PÁGINA -->
    <section class="hero hero--small">
    <div class="container">
        <h1 class="hero__title" id="heroTitulo">Detalle del producto</h1>
        <p class="hero__text" id="heroSubtitulo">Toda la información que necesitas antes de contactar al vendedor.</p>
    </div>
    </section>

    <div class="container" id="contenedorProducto">
      <!-- El contenido se genera con producto.js -->
    </div>

</main>

<script src="producto-store.js"></script>
<script src="producto.js"></script>
<script>
  document.getElementById('menuToggle').addEventListener('click', function () {
    document.getElementById('nav').classList.toggle('open');
  });

  window.addEventListener('scroll', function () {
    document.getElementById('header').classList.toggle('scrolled', window.scrollY > 40);
  });
</script>

<footer style="background:#171717; color:#C9C4B5; padding:30px clamp(20px,4vw,56px); text-align:center; font-size:12.5px;">
  <div style="color:#fff; font-family:'Sora', sans-serif; font-weight:700; margin-bottom:6px;">UNIMARKET</div>
  <div>Un proyecto estudiantil de la Universitaria de Colombia</div>
</footer>

</body>
</html>
